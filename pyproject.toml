[project]
name = "ripperr-knowledge-base"
version = "0.1.0"
description = "Private hybrid index and MCP retrieval server for ripperr transcripts"
requires-python = ">=3.11,<3.14"
dependencies = [
  "model2vec>=0.9,<0.10",
  "sqlite-vec>=0.1.6,<0.2",
  "mcp>=2.3,<3",
  # 49+ ships no Intel macOS wheel, and the Mac Pro has no Rust toolchain to build one.
  "cryptography<49",
]

[project.scripts]
kb = "knowledge_base.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_base"]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
